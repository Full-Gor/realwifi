# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Use AndroidX
android.useAndroidX=true

# Enable Gradle daemon
org.gradle.daemon=true

# Enable parallel builds
org.gradle.parallel=true

# Disable configuration cache (can cause issues with React Native composite builds)
org.gradle.configuration-cache=false

# Enable Gradle build cache
org.gradle.caching=true

# React Native settings
newArchEnabled=true
hermesEnabled=true

# Use prebuilt binaries (do not build from source)
react.internal.publishingGroup=com.facebook.react

# Android SDK versions
android.compileSdk=35
android.targetSdk=35
android.minSdk=24

# Kotlin/Compose compatibility
kotlin.jvm.target.validation.mode=IGNORE
android.suppressKotlinVersionCompatibilityCheck=true
